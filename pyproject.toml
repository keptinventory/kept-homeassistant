[project]
name = "kept-homeassistant"
version = "0.1.0"
description = "Kept for Home Assistant"
license = "Apache-2.0"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D", "PL", "ASYNC", "PT"]
ignore = ["D203", "D213", "D401", "PLR2004", "PLR0913", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR0915"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.kept"]
known-third-party = ["homeassistant"]
combine-as-imports = true
